services:

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    hostname: kafka
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29092

      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server kafka:19092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

    restart: unless-stopped

    networks:
      - payment-network


  payment-api:

    build:
      context: ./payment-api

    container_name: payment-api

    ports:
      - "8080:8080"

    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - payment-network


  payment-stream:

    build:
      context: ./payment-stream

    container_name: payment-stream

    ports:
      - "8081:8081"

    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - payment-network


  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop

    ports:
      - "9000:9000"

    environment:
      KAFKA_BROKERCONNECT: kafka:19092

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - payment-network


networks:

  payment-network:
    driver: bridge